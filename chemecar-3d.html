$('#card').onclick=e=>{if(e.target.id=='iso'){iso=!iso;select(sel.id)}if(e.target.id=='dl1')dl([sel],sel.id+'-stl.zip')};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));['ex','st','wr','sb'].forEach(i=>$('#'+i).oninput=refresh);
let dn=null;R.domElement.onpointerdown=e=>dn=[e.clientX,e.clientY];
R.domElement.onpointerup=e=>{if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>4)return;const r=R.domElement.getBoundingClientRect(),ms=new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),rc=new T.Raycaster();rc.setFromCamera(ms,cam);
 const h=rc.intersectObjects(parts.filter(p=>p.g.visible).map(p=>p.g),true).find(x=>x.object.userData.p&&x.object.material.opacity>.2);select(h?h.object.userData.p:null)};
// STL zip
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})(),crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(fs){const ch=[],cd=[],en=new TextEncoder(),w=(n,f)=>{const b=new DataView(new ArrayBuffer(n));f(b);return new Uint8Array(b.buffer)};let off=0;
 fs.forEach(f=>{const n=en.encode(f.n),c=crc(f.d),s=f.d.length;ch.push(w(30,b=>{b.setUint32(0,0x04034b50,1);b.setUint16(4,20,1);b.setUint32(14,c,1);b.setUint32(18,s,1);b.setUint32(22,s,1);b.setUint16(26,n.length,1)}),n,f.d);
 cd.push(w(46,b=>{b.setUint32(0,0x02014b50,1);b.setUint16(4,20,1);b.setUint16(6,20,1);b.setUint32(16,c,1);b.setUint32(20,s,1);b.setUint32(24,s,1);b.setUint16(28,n.length,1);b.setUint32(42,off,1)}),n);off+=30+n.length+s});
 const cs=cd.reduce((a,x)=>a+x.length,0);return new Blob([...ch,...cd,w(22,b=>{b.setUint32(0,0x06054b50,1);b.setUint16(8,fs.length,1);b.setUint16(10,fs.length,1);b.setUint32(12,cs,1);b.setUint32(16,off,1)})])}
async function dl(list,name){const hl=$('#hl');try{const D=window.claude?await claude.use('downloads'):null;if(!D){hl.textContent='Downloads need the published page view.';return}
 const ex=new T.STLExporter(),fs=list.map(p=>{const s=new T.Scene(),c=p.g.clone(),rm=[];c.position.set(0,0,0);c.traverse(m=>{if(m.isMesh&&m.userData.np)rm.push(m)});rm.forEach(m=>m.parent.remove(m));s.add(c);s.updateMatrixWorld(true);const o=ex.parse(s,{binary:true});return{n:p.id+'.stl',d:o instanceof DataView?new Uint8Array(o.buffer):new TextEncoder().encode(o)}});
 await D.save({filename:name,data:zip(fs)});hl.textContent='Saved. Millimetres, Y-up: lay each part flat in your slicer.'}catch(e){hl.textContent=e&&e.code=='declined'?'Download cancelled.':'Download unavailable here.'}}
// simulation
const VEL=.35,K=1.75,C1=new T.Color('#dbeafe'),C2=new T.Color('#17103a');let sim=null,gx=0;
const pred=()=>(VEL*(+$('#tt').value+2.6)+.2).toFixed(1);
function idle(){sim=null;lever.rotation.x=0;setL(25);L.material.color.set(C1);setLb(1);gx=0;grid.position.x=0;$('#go').disabled=false;$('#tv').textContent=$('#tt').value;$('#hl').textContent=`Ready. Predicted stop ≈ ${pred()} m, from ${VEL} m/s, ~2.6 s mixing and endpoint, and 0.20 m coast. These are illustrative values, not measurements of your car.`}
$('#go').onclick=()=>{sim={t:0,d:0,cut:false};$('#go').disabled=true};$('#rs').onclick=idle;$('#tt').oninput=()=>{if(!sim)idle()};$('#tv').textContent=55;
const clk=new T.Clock();
function tick(dt){if(!sim||sim.end)return;const s=dt*$('#sx').value;sim.t+=s;const t=sim.t,T0=+$('#tt').value;
 lever.rotation.x=.3*Math.min(1,t/.5);const f=Math.min(1,Math.max(0,(t-.3)/1.7));setLb(1-f);setL(25+25.5*f);
 const sg=1/(1+Math.exp(-(t-2-T0)/1.2)),a0=Math.round(800-650*sg);L.material.color.lerpColors(C1,C2,sg);
 if(!sim.cut&&a0<400){sim.cut=true;sim.tc=t}const v=sim.cut?VEL*Math.exp(-K*(t-sim.tc)):VEL;sim.d+=v*s;
 wheels.forEach(w=>w.rotation.z-=v/.035*dt);gx=(gx-v*1000*dt)%100;grid.position.x=gx;
 if(sim.cut&&v<.003){sim.end=true;$('#go').disabled=false}
 $('#hl').innerHTML=`t = ${t.toFixed(1)} s · RUN switch closed · LDR reading A0 = ${a0} (stop below 400) · relay ${sim.cut?'<b>OPEN, motor off, coasting</b>':'closed, motor on'} · distance <b>${sim.d.toFixed(2)} m</b>${sim.end?'<br>Stopped. The clock endpoint cut power at '+(VEL*(sim.tc-0)).toFixed(1)+' m and the car coasted to '+sim.d.toFixed(1)+' m.':''}`}
function resize(){const c=$('#cv');R.setSize(c.clientWidth,c.clientHeight,false);cam.aspect=c.clientWidth/c.clientHeight;cam.updateProjectionMatrix()}
new ResizeObserver(resize).observe($('#cv'));
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);tick(dt);spin.rotation.y+=dt*(sim&&!sim.end?20:0);
 if(goalT){ctl.target.lerp(goalT,.12);cam.position.lerp(goalP,.12);if(cam.position.distanceTo(goalP)<1&&ctl.target.distanceTo(goalT)<1)goalT=null}ctl.update();R.render(S,cam)})();
idle();refresh();resize();
</script></body></html>
